<style>
/* ============================================================
   SPLIT PORTAL — TRUE DIAGONAL CLIP-PATH LANDING
   The diagonal is defined by:  top-edge X = 57vw,  bottom-edge X = 43vw
   Both panels sit absolute/full-size; clip-path is the only boundary.
   ============================================================ */

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

main {
  height: 100vh !important;
  flex-grow: 0 !important;
}

/* Container */
.split-portal {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ---- Both panels span the full viewport ---- */
.split-panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  text-decoration: none;
  cursor: pointer;
  /* clip-path transition handles the diagonal expansion */
  transition: clip-path 0.65s cubic-bezier(0.77, 0, 0.175, 1);
}

.split-portal:has(.split-panel--left:hover) .split-panel--left,
.split-portal:has(.split-panel--left.active) .split-panel--left {
  clip-path: polygon(0 0, 67% 0, 53% 100%, 0 100%);
}
.split-portal:has(.split-panel--left:hover) .split-panel--right,
.split-portal:has(.split-panel--left.active) .split-panel--right {
  clip-path: polygon(67% 0, 100% 0, 100% 100%, 53% 100%);
}

.split-portal:has(.split-panel--right:hover) .split-panel--left,
.split-portal:has(.split-panel--right.active) .split-panel--left {
  clip-path: polygon(0 0, 47% 0, 33% 100%, 0 100%);
}
.split-portal:has(.split-panel--right:hover) .split-panel--right,
.split-portal:has(.split-panel--right.active) .split-panel--right {
  clip-path: polygon(47% 0, 100% 0, 100% 100%, 33% 100%);
}

/* ---- Background images ---- */
.split-panel__bg {
  position: absolute;
  inset: -5%;           /* slight bleed so zoom has room */
  background-size: cover;
  background-position: center;
  transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1),
              filter 0.7s ease;
  will-change: transform;
}

.split-panel__bg--left  {
  background-image: url('/assets/mops-maid.jpg');
}
.split-panel__bg--right {
  background-image: url('/assets/mops-resto.png');
  background-color: #05152a;
}

@media (min-width: 769px) {
  .split-panel__bg--left {
    left: -5%;
    width: 75%;
    right: auto;
  }
  .split-panel__bg--right {
    left: 30%;
    width: 75%;
    right: auto;
  }
}


/* Hovered panel: zoom in + full brightness */
.split-panel:hover .split-panel__bg,
.split-panel.active .split-panel__bg {
  transform: scale(1.06);
  filter: brightness(1.05);
}

/* Non-hovered panel dims when a sibling is hovered */
.split-portal:has(.split-panel:hover) .split-panel:not(:hover) .split-panel__bg,
.split-portal:has(.split-panel.active) .split-panel:not(.active) .split-panel__bg {
  filter: brightness(0.45);
}

/* ---- Dark gradient overlay ---- */
.split-panel__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(5, 21, 42, 0.45) 0%,
    rgba(5, 21, 42, 0.10) 45%,
    rgba(5, 21, 42, 0.52) 100%
  );
  transition: background 0.5s ease;
}

/* Hovered: lighter overlay so image shines through */
.split-panel:hover .split-panel__overlay,
.split-panel.active .split-panel__overlay {
  background: linear-gradient(
    to bottom,
    rgba(5, 21, 42, 0.25) 0%,
    rgba(5, 21, 42, 0.05) 45%,
    rgba(5, 21, 42, 0.30) 100%
  );
}

/* Non-hovered: heavy overlay to darken it further */
.split-portal:has(.split-panel:hover) .split-panel:not(:hover) .split-panel__overlay,
.split-portal:has(.split-panel.active) .split-panel:not(.active) .split-panel__overlay {
  background: linear-gradient(
    to bottom,
    rgba(5, 21, 42, 0.75) 0%,
    rgba(5, 21, 42, 0.55) 45%,
    rgba(5, 21, 42, 0.80) 100%
  );
}

/* ---- Content — pinned to the visual centre of each half ---- */
.split-panel__content {
  position: absolute;
  top: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 18px;
  /* default: centred in the panel element; overridden per side below */
}

/* Left content sits at ~24vw from the left edge (middle of the ~48% visible slice) */
.split-panel--left .split-panel__content {
  left: 24%;
  transform: translate(-50%, -50%);
  transition: left 0.65s cubic-bezier(0.77, 0, 0.175, 1), transform 0.4s ease;
}
/* Right content sits at ~76vw from left edge */
.split-panel--right .split-panel__content {
  left: 76%;
  transform: translate(-50%, -50%);
  transition: left 0.65s cubic-bezier(0.77, 0, 0.175, 1), transform 0.4s ease;
}

/* Shift content when hovering */
.split-portal:has(.split-panel--left:hover)  .split-panel--left .split-panel__content,
.split-portal:has(.split-panel--left.active) .split-panel--left .split-panel__content  { left: 28%; }
.split-portal:has(.split-panel--left:hover)  .split-panel--right .split-panel__content,
.split-portal:has(.split-panel--left.active) .split-panel--right .split-panel__content { left: 78%; }
.split-portal:has(.split-panel--right:hover) .split-panel--right .split-panel__content,
.split-portal:has(.split-panel--right.active) .split-panel--right .split-panel__content { left: 72%; }
.split-portal:has(.split-panel--right:hover) .split-panel--left .split-panel__content,
.split-portal:has(.split-panel--right.active) .split-panel--left .split-panel__content  { left: 20%; }

/* ---- Logo ---- */
.split-logo {
  width: clamp(140px, 18vw, 240px);
  height: auto;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
  transition: transform 0.4s ease, filter 0.4s ease;
}
.split-panel:hover .split-logo,
.split-panel.active .split-logo {
  transform: scale(1.15);
  filter: drop-shadow(0 6px 20px rgba(0,0,0,0.65));
}

/* ---- Label ---- */
.split-panel__label {
  font-family: 'Outfit', 'Montserrat', sans-serif;
  font-size: clamp(0.8rem, 1.2vw, 1rem);
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  margin: 0;
  transition: color 0.35s ease;
}
.split-panel:hover .split-panel__label { color: #fff; }

/* ---- CTA button — fades in on hover ---- */
.split-panel__cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: 'Outfit', 'Montserrat', sans-serif;
  font-size: clamp(0.85rem, 1.2vw, 1.1rem);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #fff;
  background: linear-gradient(90deg, #e9284f, #f68722);
  padding: 14px 36px;
  border-radius: 50px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease 0.05s,
              transform 0.4s ease 0.05s,
              box-shadow 0.3s ease;
  box-shadow: 0 4px 20px rgba(233,40,79,0.35);
  white-space: nowrap;
}

.split-panel--right .split-panel__cta {
  background: linear-gradient(90deg, #652dff, #a25cff);
  box-shadow: 0 4px 20px rgba(101, 45, 255, 0.35);
}

.split-panel:hover .split-panel__cta,
.split-panel.active .split-panel__cta {
  opacity: 1;
  transform: translateY(0);
}

.split-arrow {
  display: inline-block;
  transition: transform 0.3s ease;
}
.split-panel:hover .split-arrow,
.split-panel.active .split-arrow { transform: translateX(4px); }


/* ============================================================
   MOBILE — horizontal split (top / bottom)
   ============================================================ */
@media (max-width: 768px) {
  .split-panel__bg {
    inset: 0;
  }
  .split-panel:hover .split-panel__bg {
    transform: none;
  }
  .split-panel__bg--left {
    background-image: url('/assets/mops-maid-mobile.jpg');
    height: 60vh;
    top: 0;
    bottom: auto;
  }
  .split-panel__bg--right {
    height: 60vh;
    top: auto;
    bottom: 0;
  }

  .split-panel--left {
    clip-path: polygon(0 0, 100% 0, 100% 57%, 0 43%);
  }
  .split-panel--right {
    clip-path: polygon(0 43%, 100% 57%, 100% 100%, 0 100%);
  }

  .split-portal:has(.split-panel--left:hover) .split-panel--left,
  .split-portal:has(.split-panel--left.active) .split-panel--left  { clip-path: polygon(0 0, 100% 0, 100% 67%, 0 53%); }
  .split-portal:has(.split-panel--left:hover) .split-panel--right,
  .split-portal:has(.split-panel--left.active) .split-panel--right { clip-path: polygon(0 53%, 100% 67%, 100% 100%, 0 100%); }
  .split-portal:has(.split-panel--right:hover) .split-panel--left,
  .split-portal:has(.split-panel--right.active) .split-panel--left  { clip-path: polygon(0 0, 100% 0, 100% 47%, 0 33%); }
  .split-portal:has(.split-panel--right:hover) .split-panel--right,
  .split-portal:has(.split-panel--right.active) .split-panel--right { clip-path: polygon(0 33%, 100% 47%, 100% 100%, 0 100%); }

  .split-panel--left .split-panel__content  {
    left: 50%;
    top: 25%;
    transform: translate(-50%, -50%);
    transition: top 0.65s cubic-bezier(0.77, 0, 0.175, 1), transform 0.4s ease;
  }
  .split-panel--right .split-panel__content {
    left: 50%;
    top: 78%;
    transform: translate(-50%, -50%);
    transition: top 0.65s cubic-bezier(0.77, 0, 0.175, 1), transform 0.4s ease;
  }

  .split-portal:has(.split-panel--left:hover)  .split-panel--left .split-panel__content,
  .split-portal:has(.split-panel--left.active)  .split-panel--left .split-panel__content  { top: 28%; left: 50%; }
  .split-portal:has(.split-panel--left:hover)  .split-panel--right .split-panel__content,
  .split-portal:has(.split-panel--left.active)  .split-panel--right .split-panel__content { top: 78%; left: 50%; }
  .split-portal:has(.split-panel--right:hover) .split-panel--right .split-panel__content,
  .split-portal:has(.split-panel--right.active) .split-panel--right .split-panel__content { top: 75%; left: 50%; }
  .split-portal:has(.split-panel--right:hover) .split-panel--left .split-panel__content,
  .split-portal:has(.split-panel--right.active) .split-panel--left .split-panel__content  { top: 22%; left: 50%; }

}
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const panels = document.querySelectorAll('.split-panel');

    panels.forEach(panel => {
      panel.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
          if (!panel.classList.contains('active')) {
            // First press: prevent navigation, make panel active
            e.preventDefault();
            panels.forEach(p => p.classList.remove('active'));
            panel.classList.add('active');
          }
          // Second press: active class exists, navigates normally
        }
      });
    });

    // Reset when tapping outside panels
    document.addEventListener('touchstart', (e) => {
      if (window.innerWidth <= 768) {
        if (!e.target.closest('.split-panel')) {
          panels.forEach(p => p.classList.remove('active'));
        }
      }
    });
  });
</script>
